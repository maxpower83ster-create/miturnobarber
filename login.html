<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Acceso Seguro | MiTurnoBarber</title>
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    .auth-wrapper {
      min-height: 85vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px 16px;
    }
    .auth-card {
      width: 100%;
      max-width: 420px;
      background: linear-gradient(145deg, #131722 0%, #0c0f16 100%);
      border: 1px solid var(--border-gold);
      border-radius: var(--radius);
      padding: 32px 24px;
      box-shadow: var(--shadow), 0 0 25px var(--primary-light);
      position: relative;
      overflow: hidden;
    }
    .auth-header {
      text-align: center;
      margin-bottom: 24px;
    }
    .auth-badge {
      font-size: 38px;
      margin-bottom: 10px;
      display: inline-block;
      filter: drop-shadow(0 0 10px var(--primary-glow));
    }
    .auth-title {
      font-size: 22px;
      font-weight: 800;
      color: #fff;
      margin-bottom: 6px;
    }
    .auth-subtitle {
      font-size: 13px;
      color: var(--text-muted);
    }
    .auth-alert {
      display: none;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 12px;
      margin-bottom: 16px;
      line-height: 1.4;
    }
    .auth-alert.error {
      display: block;
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid #ef4444;
      color: #fca5a5;
    }
    .auth-alert.warning {
      display: block;
      background: rgba(234, 179, 8, 0.15);
      border: 1px solid #eab308;
      color: #fef08a;
    }
    .auth-footer {
      text-align: center;
      margin-top: 20px;
      font-size: 12px;
      color: var(--text-muted);
      border-top: 1px solid rgba(255,255,255,0.06);
      padding-top: 16px;
    }
  </style>
</head>
<body>

  <!-- Header mínimo -->
  <header class="header">
    <div class="logo-container">
      <div class="logo-badge">💈</div>
      <div class="logo-text">
        <h1>MiTurnoBarber</h1>
        <p>Acceso Seguro a Plataforma</p>
      </div>
    </div>
    <a href="index.html" class="btn btn-secondary btn-sm">🏠 Inicio</a>
  </header>

  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-header">
        <div class="auth-badge">🔐</div>
        <h2 class="auth-title">Iniciar Sesión</h2>
        <p class="auth-subtitle">Ingresa con tus credenciales asignadas</p>
      </div>

      <div id="authAlert" class="auth-alert"></div>

      <form id="loginForm" onsubmit="handleLogin(event)">
        <div class="form-group">
          <label class="form-label">Correo Electrónico o Usuario:</label>
          <input type="text" id="loginEmail" class="form-input" placeholder="ej: contacto@casabrava.com" required autocomplete="username">
        </div>

        <div class="form-group">
          <label class="form-label">Contraseña:</label>
          <input type="password" id="loginPassword" class="form-input" placeholder="••••••••" required autocomplete="current-password">
        </div>

        <button type="submit" id="loginSubmitBtn" class="btn btn-primary btn-block" style="padding: 12px; font-weight: 800; margin-top: 10px;">
          Ingresar al Panel Seguro ➔
        </button>
      </form>

      <!-- Botones de Acceso Rápido / 1 Clic para Administrador y Barbería -->
      <div style="margin-top: 20px; padding: 12px; background: rgba(255,255,255,0.03); border: 1px dashed rgba(255,255,255,0.15); border-radius: 8px;">
        <div style="font-size: 11px; font-weight: 700; color: #ffd700; text-transform: uppercase; margin-bottom: 8px; text-align: center;">
          ⚡ Acceso Rápido en 1 Clic:
        </div>
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px;">
          <button type="button" onclick="quickFillAndLogin('admin@miturnobarber.com', 'admin123')" class="btn btn-secondary btn-sm" style="font-size: 11px; padding: 8px 4px; border-color: #ffd700; color: #ffd700;">
            👑 SuperAdmin
          </button>
          <button type="button" onclick="quickFillAndLogin('contacto@casabrava.com', 'barber123')" class="btn btn-secondary btn-sm" style="font-size: 11px; padding: 8px 4px; border-color: var(--primary); color: var(--primary);">
            💈 Barbero Demo
          </button>
        </div>
      </div>

      <div class="auth-footer">
        ¿Aún no tienes una cuenta para tu barbería? <br>
        <a href="index.html" style="color: var(--primary); text-decoration: none; font-weight: 700;">Ver Planes Comerciales y Demos</a>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
  <script>
    async function handleLogin(e) {
      e.preventDefault();
      const email = document.getElementById('loginEmail').value.trim();
      const password = document.getElementById('loginPassword').value.trim();
      const alertBox = document.getElementById('authAlert');
      const submitBtn = document.getElementById('loginSubmitBtn');

      alertBox.className = 'auth-alert';
      alertBox.style.display = 'none';

      submitBtn.disabled = true;
      submitBtn.innerText = 'Verificando con Supabase...';

      try {
        // AUTENTICACIÓN DIRECTA DE SUPERADMIN
        if ((email.toLowerCase() === 'admin@miturnobarber.com' || email.toLowerCase() === 'admin') && password === 'admin123') {
          const userObj = { email: 'admin@miturnobarber.com', role: 'superadmin', name: 'Super Admin' };
          localStorage.setItem('currentUser', JSON.stringify(userObj));
          localStorage.setItem('shopRole', 'superadmin');
          localStorage.setItem('miturnobarber_auth_session_v9', JSON.stringify({
            role: 'superadmin',
            email: 'admin@miturnobarber.com',
            name: 'Super Admin',
            token: 'sa_' + Date.now(),
            loginAt: new Date().toISOString()
          }));

          submitBtn.innerText = '¡Acceso Concedido! Redirigiendo...';
          window.location.href = 'superadmin.html';
          return;
        }

        const result = await authenticateUser(email, password);

        if (!result.success) {
          alertBox.className = 'auth-alert error';
          alertBox.innerText = result.message || 'Credenciales incorrectas. Verifica correo y contraseña.';
          alertBox.style.display = 'block';
          submitBtn.disabled = false;
          submitBtn.innerText = 'Ingresar al Panel Seguro ➔';
          return;
        }

        // Si authenticateUser responde superadmin
        if (result.role === 'superadmin') {
          const userObj = { email: 'admin@miturnobarber.com', role: 'superadmin', name: 'Super Admin' };
          localStorage.setItem('currentUser', JSON.stringify(userObj));
          localStorage.setItem('shopRole', 'superadmin');
          if (result.session) {
            localStorage.setItem(STORAGE_KEYS.AUTH_SESSION, JSON.stringify(result.session));
          }

          submitBtn.innerText = '¡Acceso Concedido! Redirigiendo...';
          window.location.href = 'superadmin.html';
          return;
        }

        // Si es Barbería (barbero o barber)
        if (result.role === 'barbero' || result.role === 'barber') {
          const shop = result.shop;
          const targetSlug = result.slug || (shop && (shop.slug || shop.id)) || 'casa-brava';

          // Guardar información de sesión completa requerida
          const userObj = { email: email, role: 'barbero', shopId: shop ? shop.id : targetSlug, slug: targetSlug };
          localStorage.setItem('currentUser', JSON.stringify(userObj));
          if (shop) {
            localStorage.setItem('currentShop', JSON.stringify(shop));
          }
          localStorage.setItem('shopRole', 'barbero');

          const statusCheck = checkShopAccessStatus(shop);
          if (!statusCheck.allowed) {
            alertBox.className = 'auth-alert warning';
            alertBox.innerHTML = `⚠️ <strong>Acceso Restringido:</strong> ${statusCheck.message}<br><br>📱 Contacta a soporte para reactivar tu cuenta: <strong>WhatsApp: 598 99 123 456</strong>`;
            alertBox.style.display = 'block';
            submitBtn.disabled = false;
            submitBtn.innerText = 'Ingresar al Panel Seguro ➔';
            logoutSession();
            return;
          }

          submitBtn.innerText = '¡Acceso Concedido! Entrando a tu panel...';
          window.location.href = `admin.html?b=${encodeURIComponent(targetSlug)}`;
          return;
        }
      } catch (err) {
        console.error('Error durante autenticación:', err);
        alertBox.className = 'auth-alert error';
        alertBox.innerText = 'Credenciales inválidas. Por favor verifica tus datos e inténtalo nuevamente.';
        alertBox.style.display = 'block';
        submitBtn.disabled = false;
        submitBtn.innerText = 'Ingresar al Panel Seguro ➔';
      }
    }

    window.onload = async function() {
      if (typeof syncFromSupabase === 'function') {
        await syncFromSupabase();
      }

      // Si ya hay sesión activa, redirigir directo
      const session = getCurrentSession();
      if (session) {
        if (session.role === 'superadmin') {
          window.location.href = 'superadmin.html';
          return;
        } else if ((session.role === 'barbero' || session.role === 'barber') && (session.shop_id || session.shopId || session.slug)) {
          const targetShopId = session.shop_id || session.shopId;
          const shops = getShops();
          const shop = shops.find(s => s.id === targetShopId || (s.slug && s.slug === session.slug));
          if (shop) {
            const check = checkShopAccessStatus(shop);
            if (check.allowed) {
              const targetSlug = session.slug || shop.slug || shop.id;
              window.location.href = `admin.html?b=${encodeURIComponent(targetSlug)}`;
              return;
            }
          }
        }
      }

      // Si viene con mensaje de redirección
      const urlParams = new URLSearchParams(window.location.search);
      if (urlParams.get('msg') === 'unauthorized') {
        const alertBox = document.getElementById('authAlert');
        alertBox.className = 'auth-alert warning';
        alertBox.innerText = '🔒 Debes iniciar sesión para acceder al panel.';
        alertBox.style.display = 'block';
      } else if (urlParams.get('msg') === 'expired') {
        const alertBox = document.getElementById('authAlert');
        alertBox.className = 'auth-alert error';
        alertBox.innerText = '⏱️ Tu período de prueba o suscripción ha vencido. Contacta al administrador para continuar.';
        alertBox.style.display = 'block';
      }
    };
    function quickFillAndLogin(email, password) {
      document.getElementById('loginEmail').value = email;
      document.getElementById('loginPassword').value = password;
      const fakeEvent = { preventDefault: () => {} };
      handleLogin(fakeEvent);
    }
  </script>
</body>
</html>
